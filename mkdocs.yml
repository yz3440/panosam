site_name: PanoSAM
site_description: Python library for running SAM3 segmentation on equirectangular panorama images
site_author: Yufeng Zhao
site_url: https://yz3440.github.io/panosam/

repo_name: yz3440/panosam
repo_url: https://github.com/yz3440/panosam

theme:
  name: terminal

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  # Python Markdown
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - toc:
      permalink: "#"
  # PyMdown Extensions
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

nav:
  - Home: index.md
  - API Reference:
      - Overview: api/index.md
      - SAM3 Engine: api/sam.md
      - Deduplication: api/dedup.md
      - Image Models: api/image.md
